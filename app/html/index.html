<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Big AOA Counter</title>
    <script>
      const proxyBasePath = '/local/big_aoa_counter/big-aoa-counter/';
      if (!window.location.pathname.startsWith(proxyBasePath)) {
        window.location.replace(proxyBasePath);
      }
    </script>
    <link rel="stylesheet" href="style.css">
  </head>
<body>
  <main class="shell">
    <section class="hero">
      <div class="hero-top">
        <div>
          <p class="eyebrow">AXIS Object Analytics</p>
          <h1 id="label">Object count</h1>
        </div>
        <span class="badge">Live</span>
      </div>
      <div class="count-card">
        <div class="count" id="count">0</div>
        <p class="meta" id="meta">Waiting for AOA data</p>
      </div>
    </section>

    <section class="panel compact">
      <h2>Widget</h2>
      <div class="widget-share">
        <label class="field">Widget URL
          <span class="tooltip" title="Standalone live counter page for embedding in a VMS or dashboard.">i</span>
          <input id="widget-url" readonly>
          <span class="hint">Use this page as a lightweight live dashboard widget.</span>
        </label>
        <button type="button" id="copy-widget-url">Copy URL</button>
      </div>
    </section>

    <section class="panel">
      <h2>Configuration</h2>
      <form id="config-form">
        <div class="field-grid">
          <label class="field">Label
            <span class="tooltip" title="Text used in the overlay and dynamic text output.">i</span>
            <input name="Label" required>
            <span class="hint">Displayed next to the live count.</span>
          </label>
          <label class="field">Mode
            <span class="tooltip" title="custom = large ACAP overlay, dynamic = Axis text slot, both = both outputs at once.">i</span>
            <select name="Mode">
              <option value="both">both</option>
              <option value="custom">custom</option>
              <option value="dynamic">dynamic</option>
            </select>
            <span class="hint">Choose where the count is rendered.</span>
          </label>
          <label class="field">Dynamic text slot
            <span class="tooltip" title="Axis dynamic text slot number. Slot 12 maps to #D12.">i</span>
            <input name="DynamicTextSlot" type="number" min="1" max="16">
            <span class="hint" id="dynamic-slot-hint">Axis overlay modifier for this slot: #D12.</span>
          </label>
          <label class="field">Scenario
            <span class="tooltip" title="Pick a specific countable AOA scenario, or leave it on automatic selection.">i</span>
            <select name="ScenarioUid" id="scenario-select">
              <option value="">Auto-select first countable scenario</option>
            </select>
            <span class="hint">Only crossline counting and occupancy scenarios are listed.</span>
          </label>
          <label class="field">AOA field
            <span class="tooltip" title="Which count value to display from the AOA response.">i</span>
            <select name="Category" id="category-select"></select>
            <span class="hint" id="category-description">Overall count for the selected scenario.</span>
          </label>
          <label class="field">Poll interval (ms)
            <span class="tooltip" title="Milliseconds between AOA polls. 1000 = 1 second.">i</span>
            <input name="PollIntervalMs" type="number" min="250" step="250">
            <span class="hint">1000 means one update per second.</span>
          </label>
          <label class="field">Overlay scale (%)
            <span class="tooltip" title="Scales the large ACAP overlay height and text. 100 keeps the default size.">i</span>
            <input name="OverlayScalePercent" type="number" min="50" max="200" step="10">
            <span class="hint">50 to 200; 100 keeps the default size.</span>
          </label>
          <label class="field">Overlay width
            <span class="tooltip" title="Controls the width of the large ACAP overlay.">i</span>
            <select name="OverlayWidthPercent">
              <option value="100">Full width</option>
              <option value="50">Half width</option>
              <option value="33">Third width</option>
            </select>
            <span class="hint">Choose how much of the stream width the overlay uses.</span>
          </label>
          <label class="field checkbox-field">Show scenario name
            <span class="tooltip" title="Shows or hides the selected AOA scenario name in the large overlay.">i</span>
            <input type="hidden" name="ShowScenarioName" id="show-scenario-name-value" value="true">
            <input type="checkbox" id="show-scenario-name" checked>
            <span class="hint">Hide this for a tighter overlay.</span>
          </label>
        </div>
        <div class="overlay-editor">
          <div class="overlay-editor-top">
            <h3>Overlay placement</h3>
            <span class="hint">Drag the sample overlay to place it on the stream.</span>
          </div>
          <input type="hidden" name="OverlayX" id="overlay-x" value="0">
          <input type="hidden" name="OverlayY" id="overlay-y" value="-0.72">
          <div class="overlay-preview" id="overlay-preview">
            <div class="overlay-sample" id="overlay-sample" tabindex="0" aria-label="Overlay position preview">
              <span class="overlay-sample-accent"></span>
              <strong id="overlay-preview-count">0</strong>
              <span id="overlay-preview-label">Object count</span>
              <span id="overlay-preview-scenario">AOA scenario</span>
            </div>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit">Save config</button>
        </div>
      </form>
    </section>

    <section class="panel compact">
      <h2>Actions</h2>
      <div class="actions">
        <button data-action="refresh">Refresh</button>
        <button data-action="discover">Auto-select scenario</button>
        <button data-action="reset">Reset accumulated count</button>
        <button data-action="alarm">Send test alarm</button>
      </div>
      <pre id="status-log"></pre>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
